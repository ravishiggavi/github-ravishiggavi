<!DOCTYPE html>
<html>
<head>
    <title>OAuth Redirect</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <h1>Auth Redirect Page</h1>
    <p id="authCode">Waiting for auth code...</p>
    <p id="statusDiv">Waiting for appIdHash...</p>
    <p id="tokenDiv">Waiting fortokenDiv...</p>
    <p id="refreshtokenDiv">Waiting for refreshtokenDiv</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const authCode = params.get("auth_code");
        const client_id = "KMUD9J1EAX-100";
        const secret_key = "0DIVX8YW6V";
        const response_type = "code";
        const grant_type = "authorization_code";  
        const REDIRECT_URI="https://ravishiggavi.github.io/github-ravishiggavi/fyer-index.html";
        const TOKEN_URL = "https://api-t1.fyers.in/api/v3/validate-authcode";

        if (authCode) {
            document.getElementById("authCode").innerText = "Auth Code: " + authCode;
            generateAppIdHash(client_id, secret_key).then(hash => {
              console.log("AppIdHash:", hash);
              document.getElementById("statusDiv").innerText = hash;
              const AppIdHash = hash;

              const payload = {
                                grant_type: "authorization_code",
                                appIdHash: AppIdHash,
                                code: authCode
                              };
                //
                // STEP 3: Make POST request
              fetch(TOKEN_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
              })
                .then(res => res.json())
                .then(data => {
                  console.log("Fyers Token Response:", data);
                  if (data.access_token) {
                    tokenDiv.innerHTML = `
                      ✅ Token generated successfully! <br><br>
                      <b>Access Token:</b><br>
                      <textarea cols="60" rows="5">${data.access_token}</textarea>
                      <b>Refresh Access Token:</b><br>
                      <textarea cols="60" rows="5">${data.refresh_token}</textarea>
                    `;
                    refreshtokenDiv.innerHTML = `
                      ✅ Refresh Token generated successfully! <br><br>
                      <b>Refresh Access Token:</b><br>
                      <textarea cols="60" rows="5">${data.refresh_token}</textarea>
                    `;
                  } else {
                    statusDiv.innerHTML = `
                      ⚠️ Failed to generate token.<br>
                      <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                  }
                })
                .catch(err => {
                  console.error(err);
                  statusDiv.innerHTML = "❌ Error: " + err.message;
                });
                //
            
            });
        
        }

        function generateAppIdHash(client_id, secret_key) {
          const input = `${client_id}:${secret_key}`;
          const encoder = new TextEncoder();
          const data = encoder.encode(input);
          return crypto.subtle.digest("SHA-256", data)
            .then(hashBuffer => {
              const hashArray = Array.from(new Uint8Array(hashBuffer));
              const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
              return hashHex;
            });
        }


        
    </script>
</body>
</html>
